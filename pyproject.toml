[project]
name = "rideflow"
version = "0.1.0"
description = "Real-time ride-hailing data platform: Kafka -> Parquet lakehouse -> dbt -> DuckDB -> Power BI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: tests that generate large event volumes",
    "contract: validates events against docs/event_contract.md",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # function call in default arg - intentional for dataclass factories
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "N802",  # test names read better as sentences
    "C408",  # dict(...) is clearer than a literal when splatted into **kwargs
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
source = ["event_generator"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
