# dbt connection profile.
#
# Kept in the project directory rather than ~/.dbt so the whole configuration is
# version-controlled and a clean clone works without per-machine setup:
#
#   cd transformation && dbt run --profiles-dir .
#
# There are no credentials here to protect - DuckDB is a local file. A cloud
# warehouse profile would read secrets from the environment instead.
#
# ── Why every target pins TimeZone: "UTC" ────────────────────────────────────
# DuckDB inherits the machine's timezone by default. On a machine set to
# Asia/Calcutta, `extract(hour FROM a_timestamptz)` silently returns IST - so
# date/time logic APPEARS correct there and returns UTC hours on a CI runner.
# The Bengaluru morning peak would land at 02:00 instead of 08:00, and the chart
# would look plausible enough to be rationalised rather than investigated.
#
# Pinned to UTC, every conversion must be explicit via
# `AT TIME ZONE dim_city.timezone`, and results are identical on every machine.
# tests/assert_session_timezone_is_utc.sql asserts the setting is in force, so
# this cannot regress silently.

rideflow:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative to the dbt project directory (transformation/).
      path: "../data/warehouse/rideflow.duckdb"

      # dbt is the SOLE writer to this file. DuckDB takes an exclusive write
      # lock, which is the constraint the entire lakehouse architecture is built
      # around: the consumer writes Parquet and never opens DuckDB, and Airflow
      # runs dbt with max_active_runs=1 so two runs can never collide.
      threads: 4

      extensions:
        - json      # payload_json extraction in staging
        - parquet   # reading the landing zone
        - icu       # named timezones for AT TIME ZONE

      settings:
        TimeZone: "UTC"

    # Same engine, separate database file, so a test run can never touch the
    # real warehouse.
    test:
      type: duckdb
      path: "../data/warehouse/rideflow_test.duckdb"
      threads: 4
      extensions:
        - json
        - parquet
        - icu
      settings:
        TimeZone: "UTC"

    # In-memory: nothing persists. Used by CI, where the landing zone is
    # generated fresh and the warehouse is disposable by definition.
    ci:
      type: duckdb
      path: ":memory:"
      threads: 4
      extensions:
        - json
        - parquet
        - icu
      settings:
        TimeZone: "UTC"
